name: follow-up-watch

# The repository's own record can go stale without anybody touching it.
# validate.yml runs on push and pull request, so a repository nobody edits
# checks nothing, and a follow-up window closes unnoticed. This job runs on
# the calendar instead, and opens an issue rather than printing into a log
# nobody reads.
#
# Known limit, stated because the kit does not get to overclaim its own
# gates: GitHub disables scheduled workflows in a public repository after
# 60 days with no repository activity. FT-001's window is 90 days long, so
# a long enough quiet stretch can switch this watch off before the date it
# was built for. GitHub emails the maintainer first, and the run can be
# started by hand from the Actions tab (workflow_dispatch) or restored by
# any commit. Treat that email as part of the tripwire.

on:
  schedule:
    # 11:00 UTC every Monday.
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  overdue-follow-ups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r requirements.txt

      - name: Check for overdue follow-ups
        id: check
        run: |
          set +e
          output=$(python3 scripts/check_repo.py --fail-on-overdue-follow-up 2>&1)
          status=$?
          set -e
          echo "$output"
          {
            echo "report<<PURELAND_EOF"
            echo "$output"
            echo "PURELAND_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update the watch issue
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPORT: ${{ steps.check.outputs.report }}
          TITLE: "Scheduled repository check failed"
        run: |
          # The strict exit code covers every repository error, not only an
          # overdue follow-up, so the issue reports what the run actually
          # said. Naming one cause for every failure would put a false claim
          # about the evidence state into the tracker.
          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq \
            "[.[] | select(.title == env.TITLE)] | first | .number // empty")

          body=$(printf '%s\n\n```\n%s\n```\n\n%s\n' \
            "The scheduled watch ran \`scripts/check_repo.py --fail-on-overdue-follow-up\` on the default branch and it failed. The report follows." \
            "$REPORT" \
            "If a field-test follow-up is overdue, close it with an outcome or record it as \`closed-unmeasurable\`. Every accepted record lives three times, so update all three: the JSON under data/field-tests/, the report under research/field-tests/, and the ledger row in CURRENT-EVIDENCE.md, which holds that file's one copy of the window date. Absence never defaults to favorable. Any other failure is an ordinary repository error.")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

      # The issue is the primary signal, but a job that ends green while
      # carrying a live finding tells the Actions tab the opposite of what
      # the run found. Failing here also triggers GitHub's own scheduled-run
      # failure mail, which is a second channel that does not depend on
      # anyone watching the tracker.
      - name: Report the run's real result
        if: steps.check.outputs.status != '0'
        run: |
          echo "The scheduled check failed; see the issue this run opened or updated."
          exit 1
