name: Field test
description: Stage 1 public-safe scoping for a proposed PureLand field test.
title: "Field-test scope: "
labels: [field-test]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. It begins Stage 1 scoping only. Use general terms. Do not include evidence links, excerpts, participant material, direct or indirect identifiers, client or confidential records, consent records, or protected community knowledge.

        Read [how to propose a pilot](https://github.com/risaac09/pureland-fork-kit/blob/main/OFFERING.md#how-to-propose-a-pilot) for the proposal process and Stage 2 requirements.
  - type: input
    id: version
    attributes:
      label: Kit commit (kit_version)
      description: Optional. The short hash from github.com/risaac09/pureland-fork-kit/commits/main, with the date. The maintainer records the accepted commit if the proposal reaches Stage 2.
  - type: dropdown
    id: instrument
    attributes:
      label: Coverage
      options:
        - Full method
        - Practice frame
        - Protocol
        - Scorecard
        - Extraction check
        - AI system annex
    validations:
      required: true
  - type: textarea
    id: practice
    attributes:
      label: Practice in general terms
      description: Describe the kind of practice without naming people, clients, communities, locations, cases, or protected records.
    validations:
      required: true
  - type: textarea
    id: importance
    attributes:
      label: Why the question matters
      description: State the reason in public-safe terms. Do not include supporting evidence or protected examples.
    validations:
      required: true
  - type: textarea
    id: proposed_scope
    attributes:
      label: Proposed scope
      description: Name the boundary of the proposed inquiry without identifying affected people or protected material.
    validations:
      required: true
  - type: dropdown
    id: participant_material
    attributes:
      label: Could participant material be involved?
      description: Report presence only. Do not describe the material or participant.
      options:
        - "Yes"
        - Unsure
        - None known
    validations:
      required: true
  - type: dropdown
    id: client_material
    attributes:
      label: Could client material be involved?
      description: Report presence only. Do not identify a client or record.
      options:
        - "Yes"
        - Unsure
        - None known
    validations:
      required: true
  - type: dropdown
    id: confidential_material
    attributes:
      label: Could confidential material be involved?
      description: Report presence only. Do not describe the material.
      options:
        - "Yes"
        - Unsure
        - None known
    validations:
      required: true
  - type: dropdown
    id: community_held_material
    attributes:
      label: Could community-held material be involved?
      description: Report presence only. Do not name a community or describe its knowledge.
      options:
        - "Yes"
        - Unsure
        - None known
    validations:
      required: true
  - type: dropdown
    id: identifying_material
    attributes:
      label: Could identifying material be involved?
      description: Include indirect identification risk. Do not provide identifying facts.
      options:
        - "Yes"
        - Unsure
        - None known
    validations:
      required: true
  - type: textarea
    id: private_boundary
    attributes:
      label: What must remain private?
      description: List categories only, such as participant material or client records. Do not include names, excerpts, links, or identifying facts.
    validations:
      required: true
  - type: textarea
    id: disconfirming_condition
    attributes:
      label: Disconfirming condition
      description: State one result that would count against the method.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        After this public scoping step, the maintainer will decide whether an appropriate private rights review can be established. Do not send protected material unless and until that review channel and the relevant authority are confirmed.
